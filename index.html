<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Visit Swayam Phadatare's portfolio.">
  <title>My Portfolio | Swayam Phadatare</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at 15% 15%, rgba(96,165,250,.18), transparent 34%),
        radial-gradient(circle at 85% 85%, rgba(129,140,248,.16), transparent 32%),
        #0b1220;
    }
    main {
      width: min(100%, 620px);
      text-align: center;
      padding: clamp(32px, 7vw, 64px) 24px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background: rgba(15, 23, 42, .76);
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
    }
    .icon {
      width: 68px; height: 68px; margin: 0 auto 24px;
      display: grid; place-items: center;
      border-radius: 20px;
      background: #60a5fa; color: #0b1220;
      font-size: 30px; font-weight: 800;
    }
    h1 { margin: 0; font-size: clamp(2.3rem, 8vw, 4rem); letter-spacing: -.045em; }
    p { margin: 16px 0 30px; color: #cbd5e1; font-size: clamp(1rem, 3vw, 1.15rem); line-height: 1.7; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 54px; padding: 0 24px; border-radius: 14px;
      background: #60a5fa; color: #0b1220; text-decoration: none;
      font-weight: 750; transition: transform .18s ease, background .18s ease;
    }
    .button:hover { background: #93c5fd; transform: translateY(-2px); }
    .button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .note { margin: 28px 0 0; font-size: .85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">↗</div>
    <h1>My Portfolio</h1>
    <p>Explore my work, projects, and journey.</p>
    <a class="button"
       href="https://swayamphadatare-portfolio9.lovable.app"
       target="_blank" rel="noopener noreferrer">
      Click to Open My Portfolio <span aria-hidden="true">↗</span>
    </a>
    <div class="note">Thanks for visiting!</div>
  </main>
</body>
</html>
